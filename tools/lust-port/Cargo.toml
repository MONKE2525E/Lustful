[package]
name = "lust-port"
version = "0.1.0"
edition = "2024"
description = "Gap scanner for porting a Rust crate to lust (lust port scan)"

# Detached from the root crate on purpose: the root must not become a workspace.
[workspace]

[[bin]]
name = "lust-port"
path = "src/main.rs"

[dependencies]
syn = { version = "=2.0.118", default-features = false, features = ["full", "visit", "parsing", "printing", "clone-impls", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
