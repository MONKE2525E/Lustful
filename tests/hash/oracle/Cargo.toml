[package]
name = "lust-hash-oracle"
version = "0.1.0"
edition = "2021"
publish = false

# Version pins are part of the test: hashbrown 0.17.1 is the table inside
# Rust 1.99 std and under indexmap 2.14.0 in ts-rust's Cargo.lock, and
# rustc-hash 2.1.2 is its FxHasher. See ../README.md.
[dependencies]
rustc-hash = "=2.1.2"
indexmap = "=2.14.0"
# For hb8 mode only, built without SSE2 in test.sh so its group is the
# generic 8-byte one. default-features off matches how indexmap uses it.
hashbrown = { version = "=0.17.1", default-features = false }

[profile.release]
debug-assertions = true
