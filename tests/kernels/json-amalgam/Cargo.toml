# Single-file amalgam variant. See ../README.md.
# Owned kernel fixture: ts-rust JSON encode/decode core (medium tier).
# Standalone on purpose: no dependencies, no workspace. lust-port scans
# this manifest to record the feature list (see ../README.md).
[package]
name = "lust-kernel-json-amalgam"
version = "0.0.1"
edition = "2024"

[[bin]]
name = "json-amalgam-kernel"
path = "src/main.rs"

[profile.release]
panic = "abort"
