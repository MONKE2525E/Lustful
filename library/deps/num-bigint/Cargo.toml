# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package num-bigint 0.4.6; release builds
# use the real crate through Cargo. The driver checks `version` against
# the resolved package and the metadata against src/resolve/adapters.rs.
[package]
name = "num-bigint"
version = "0.4.6"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
features = ["default", "std"]
# Sign is a fieldless enum in both crates: same size, align, and niche.
exact-layout = ["num_bigint::bigint::Sign"]
