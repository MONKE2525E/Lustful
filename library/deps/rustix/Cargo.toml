# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package rustix 1.1.5; release builds
# use the real crate through Cargo. The driver checks `version` against
# the resolved package and the metadata against src/resolve/adapters.rs.
[package]
name = "rustix"
version = "1.1.5"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
# The fs, process, termios, pipe, event, and stdio subsets in src/,
# plus the std surface they need. `net` and the rest are not here.
features = ["default", "std", "alloc", "fs", "process", "termios", "pipe", "event", "stdio"]
