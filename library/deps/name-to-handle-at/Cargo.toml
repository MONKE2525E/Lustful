# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package name-to-handle-at 0.1.0;
# release builds use the real crate through Cargo. The driver checks
# `version` against the resolved package and the metadata against
# src/resolve/adapters.rs.
[package]
name = "name-to-handle-at"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
# The crate has no features; `default` is always enabled.
features = ["default"]
