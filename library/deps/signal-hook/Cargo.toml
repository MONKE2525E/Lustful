# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package signal-hook 0.4.4; release
# builds use the real crate through Cargo. The driver checks `version`
# against the resolved package and the metadata against
# src/resolve/adapters.rs.
[package]
name = "signal-hook"
version = "0.4.4"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
# Upstream's default has no optional parts the adapter surface needs.
features = ["default", "channel", "iterator"]
