# Lust adapter crate (docs/ARCH.md section 3.6). Dev builds compile this
# crate in place of the registry package nix 0.31.3; release builds use
# the real crate through Cargo. The driver checks `version` against the
# resolved package and the metadata against src/resolve/adapters.rs.
[package]
name = "nix"
version = "0.31.3"
edition = "2024"
publish = false

[package.metadata.lust]
adapter = 1
# Only the prctl forms of the process feature and the fanotify
# group/mark forms are implemented; the feature names list what
# ts-rust's units resolve to.
features = ["fanotify", "process", "signal"]
